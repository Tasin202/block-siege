<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),K='block_siege_v1';cv.width=960;cv.height=540;
const DF=()=>({name:'',gems:0,mat:{wood:0,stone:0,iron:0},lv:{shooter:1,miner:1,wall:1,cannon:1},best:0,kills:0,runs:0,set:{snd:1,mus:1,spd:1,dif:1,fx:1,hp:1}});

let G=null,st='menu',bk='m',mx=-1,my=-1,rs=0,ac;

function snd(f,d=.08,t='square',v=.04){if(!S.set.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),a=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

function run(){G={w:0,th:800,tm:800,sc:150,P:[],Z:[],B:[],A:[],F:[],sel:null,q:[],ck:0,kl:0,sh:0,ban:0,tot:1,lt:{g:0,m:{wood:0,stone:0,iron:0}}};S.runs++;nextWave()}

function hit(z,dm){if(z.dead)return;z.hp-=dm;z.f=.08;snd(200,.04,'square',.02);if(z.hp<=0)die(z)}

const gm=b?25:(Math.random()<.35?1+(G.w/4|0):0);if(gm){G.lt.g+=gm;S.gems+=gm;fx(z.x,y,'💎+'+gm,'#7fe9ff')}

function sets(b){bk=b;const s=S.set,o=['Off','On'],r=(l,k,v)=>`<div class=r><span>${l}</span><button class="b s" onclick="tg('${k}')">${v}</button></div>`;

function tg(k){if(k=='spd')S.set.spd=S.set.spd==1?1.5:S.set.spd==1.5?2:1;else if(k=='dif')S.set.dif=(S.set.dif+1)%3;else if(k=='nm'){try{const n=prompt('Player name',S.name);if(n)S.name=esc(n.trim()).slice(0,14)||S.name}catch(e){}}

function prof(){show(`<h2>👤 ${esc(S.name)}</h2><p>Best wave: <b>${S.best}</b> · Zombies defeated: <b>${S.kills}</b> · Runs: <b>${S.runs}</b></p><p>${T.map(k=>D[k].e+' Lv'+S.lv[k]).join(' &nbsp; ')}</p><p><small>Your profile is saved on this device. Online accounts and leaderboards need a server, a future update.</small></p>`+bt('Back','menu()'))}
function how(){show(`<h2>❓ How to play</h2><p style="text-align:left">🏰 <b>Protect your tower!</b> Zombies attack it if they get through.<br>⚡ Scrap buys defenders: pick a card, tap a tile.<br>⛏️ Miners go in the <b>two dirt rows</b> (bottom). Zombies never attack it.<br>🔫 Blasters, 💣 Cannons and 🧱 Walls go on the grass lanes.<br>🏹 Skeleton archers shoot from far away, so kill them fast.<br>💎 Loot → 🔧 Workshop → permanent upgrades.<br>Keys: 1-5 select, Esc pause.</p>`+bt('Back','menu()'))}
function pz(){st='pause';show('<h2>⏸ Paused</h2>'+bt('▶ Resume',"hide();st='play'",'go')+bt('⚙️ Settings',"sets('p')")+bt('Quit to menu','menu()'))}
function cell(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*960/r.width,(e.clientY-r.top)*540/r.height]}

const PT=new Map();let dr=0,pdx=0;

let zf=1,tx=-1.2,tz=-.6;const W3=THREE,rend=new W3.WebGLRenderer({canvas:$('#t'),antialias:true});rend.setSize(960,540,false);rend.setPixelRatio(Math.min(devicePixelRatio||1,2));rend.shadowMap.enabled=true;
